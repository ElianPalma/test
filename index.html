<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section Profesional</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section class="hero" id="inicio">
        <div class="hero-container">
            <div class="hero-content fade-in">
                <h1 class="hero-title">Soluciones Digitales <span>Escalables</span></h1>
                <p class="hero-subtitle">Desarrollo web y móvil de alto rendimiento diseñado para optimizar procesos y escalar proyectos exigentes.</p>
                <div class="hero-actions">
                    <a href="#contacto" class="btn btn-primary">Iniciar Proyecto</a>
                    <a href="#portafolio" class="btn btn-secondary">Ver Portafolio</a>
                </div>
            </div>
            
            <div class="hero-visual fade-in">
                <div class="visual-placeholder"></div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
